name: CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  check-workflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        id: actionlint
        run:
          bash <(curl
          https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check workflow
        run: ${{ steps.actionlint.outputs.executable }} -color

  check-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install strew
        run: |
          curl -fsSL https://github.com/terror/strew/releases/download/0.1.0/strew-0.1.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C "$RUNNER_TEMP" ./strew
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check config
        run: HOME="$(mktemp -d)" strew --dry-run

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        name: Check lua formatting
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Check bash scripts
        run: shellcheck bin/*
